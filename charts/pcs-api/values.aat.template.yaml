# Don't modify this file, it is only needed for the pipeline to set the image and ingressHost
java:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    ENABLE_TESTING_SUPPORT: true
    CASE_TYPE_SUFFIX: "staging"
    LAUNCHDARKLY_ENV: "staging"
    SDP_EXPORT_ENABLED: true
    SDP_EXPORT_UPLOAD_ENABLED: true
    # Staging shares the AAT scheduled_tasks table; must match flux aat.yaml or it reschedules AAT's sweep
    BULK_PRINT_SCHEDULE: "FIXED_DELAY|900s"
    BULK_PRINT_LOOKBACK_HOURS: "1"
