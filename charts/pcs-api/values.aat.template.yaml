# Don't modify this file, it is only needed for the pipeline to set the image and ingressHost
java:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    ENABLE_TESTING_SUPPORT: true
    # HDPI-9102: lets the SDP export functional test write to pcssdpaat as pcs-aat-mi.
    SDP_EXPORT_ENABLED: true
    CASE_TYPE_SUFFIX: "staging"
    LAUNCHDARKLY_ENV: "staging"
