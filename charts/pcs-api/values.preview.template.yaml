global:
  postgresSecret: ${SERVICE_NAME}-postgresql
java:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  keyVaults:
    pcs:
      secrets:
        - name: pcs-api-s2s-secret
          alias: PCS_API_S2S_SECRET
        - name: gov-notify-key
          alias: PCS_NOTIFY_API_KEY
        - name: hmc-servicebus-connection-string
          alias: HEARINGS_SERVICEBUS_CONNECTION_STRING
        - name: pcs-api-idam-secret
          alias: IDAM_CLIENT_SECRET
        - name: idam-system-user-name
          alias: PCS_IDAM_SYSTEM_USERNAME
        - name: idam-system-user-password
          alias: PCS_IDAM_SYSTEM_PASSWORD
        - name: pcs-prd-admin-username
          alias: PCS_PRD_ADMIN_USERNAME
        - name: pcs-prd-admin-password
          alias: PCS_PRD_ADMIN_PASSWORD
        - name: launchdarkly-sdk-key
          alias: LAUNCHDARKLY_SDK_KEY
  environment:
    PCS_DB_HOST: "{{ .Release.Name }}-postgresql"
    # HDPI-8115: preview shares one small flexible server across ~70 releases;
    # shrink per-pod pools so idle stacks hold no connections.
    PCS_DB_POOL_MIN_IDLE: "0"
    PCS_DB_POOL_MAX_SIZE: "2"
    PCS_DB_USER_NAME: "{{ .Values.postgresql.auth.username}}"
    PCS_DB_NAME: "{{ .Values.postgresql.auth.database}}"
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    DB_SCHEDULER_THREADS: "2"
    FLYWAY_NOOP_STRATEGY: "false"
    SPRING_FLYWAY_LOCATIONS: "classpath:db/migration,classpath:db/testdata"
    SPRING_LOGGING_LEVEL_ROOT: "DEBUG"
    ENABLE_TESTING_SUPPORT: true
    LAUNCHDARKLY_ENV: "${SERVICE_NAME}"
    DB_SCHEDULER_EXECUTOR_ENABLED: true
    BULK_PRINT_SCHEDULE: "FIXED_DELAY|600s"
    BULK_PRINT_LOOKBACK_HOURS: "1"
    DOC_ASSEMBLY_URL: http://dg-docassembly-aat.service.core-compute-aat.internal
    SEND_LETTER_URL: http://rpe-send-letter-service-aat.service.core-compute-aat.internal
    IDAM_API_URL: https://idam-api.aat.platform.hmcts.net
    IDAM_S2S_AUTH_URL: http://rpe-service-auth-provider-aat.service.core-compute-aat.internal
    NOTIFY_URL: https://api.notifications.service.gov.uk
    CCD_SDK_DECENTRALISED: "true"
    PAYMENTS_API_URL: http://payment-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    PAY_CALLBACK_URL: https://${SERVICE_NAME}.preview.platform.hmcts.net/payment-update
    PCS_FRONTEND_URL: ${PCS_FRONTEND_URL}
    MANAGE_CASE_BASE_URL: ${MANAGE_CASE_BASE_URL}
    NOTIFY_TEMPLATE_RESPONSE_NO_COUNTERCLAIM: "5abcd184-3409-41de-b13c-83b5f1e2469d"
    NOTIFY_TEMPLATE_RESPONSE_NO_COUNTERCLAIM_LEGAL_REP: "ae3cb187-5862-4c07-a7c4-589bc3aab2d9"
    NOTIFY_TEMPLATE_COUNTERCLAIM_PAYMENT_REQUIRED: "b7c7e5b1-cd73-49cd-9c71-eb4fe16b0ddf"
    NOTIFY_TEMPLATE_COUNTERCLAIM_PAYMENT_REQUIRED_LEGAL_REP: "eb29b8e7-5a17-445e-b2b6-f9d11cdc71ad"
    NOTIFY_TEMPLATE_COUNTERCLAIM_PAYMENT_SUCCESS: "472e9d65-d496-4421-978e-2e7a733ce064"
    NOTIFY_TEMPLATE_COUNTERCLAIM_PAYMENT_SUCCESS_LEGAL_REP: "7183c87e-466f-4559-b5ac-e58432c4b071"
    NOTIFY_TEMPLATE_COUNTERCLAIM_NO_PAYMENT_REQUIRED: "cf320c6a-c797-4a9f-ace2-e93c8c795809"
    NOTIFY_TEMPLATE_MAKE_A_CLAIM_SAVED_FOR_LATER: "05b820d3-5887-4f4f-adf8-07e32d3a4caa"
    NOTIFY_TEMPLATE_MAKE_A_CLAIM_DEFENDANT_MADE_COUNTERCLAIM: "1b9a51dc-dabc-4cad-a9f2-76181266b9fd"
    NOTIFY_TEMPLATE_MAKE_A_CLAIM_DEFENDANT_RESPONSE_RECEIVED: "33696528-2c19-462b-b879-b7546184953e"
    NOTIFY_TEMPLATE_MAKE_A_CLAIM_ISSUED: "18835d17-afbe-409d-8f03-e89dfd51c7f9"
    NOTIFY_TEMPLATE_GENERAL_APPLICATION_RECEIVED: "fa721ba0-18ab-4018-a2fa-e55056f2c847"
    NOTIFY_TEMPLATE_COUNTERCLAIM_NOT_SUBMITTED_YET: "6cef5d05-3ae3-4487-8eec-75029bc4bfe2"
    NOTIFY_TEMPLATE_NOTICE_OF_CHANGE_COMPLETED: "fc9416ba-9b8e-43ce-ab11-9e9a07946e61"
    NOTIFY_TEMPLATE_NOTICE_OF_CHANGE_COMPLETE_LEGAL_REP: "b121bc29-d5f7-4ed4-9cbc-89fdc13c977c"
    NOTIFY_TEMPLATE_NOTICE_OF_CHANGE_NO_LONGER_REPRESENTING: "b5223559-6419-4849-a609-aac606b17a86"
    NOTIFY_TEMPLATE_NOTICE_OF_CHANGE_OTHER_PARTY_REPRESENTED: "f7963e8e-c868-42fe-9367-0038552ca851"
    # Work allocation should only be called in Preview when dedicated pods are included via the pr-values:wa label.
    # Otherwise, the requests are sent to WA AAT, which attempts to fetch the case data from CCD AAT where it
    # cannot be found. This leads to the task initiation failing and being retried multiple times.
    # The sending of WA requests is controlled by a feature flag as well, but the API url is overridden here as
    # a safety mechanism in case the feature flag config is incorrect for a preview environment.
    WA_WORKFLOW_API: http://localhost/should-not-be-called
  secrets:
    PCS_DB_PASSWORD:
      secretRef: "{{ .Values.global.postgresSecret }}"
      key: password
  postgresql:
    enabled: true
    image:
      tag: "16.0.0"
