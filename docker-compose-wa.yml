services:
  camunda-local:
    platform: linux/amd64
    image: hmctssandbox.azurecr.io/camunda-local:0.2
    container_name: camunda-local
    networks:
      - wa-network
    volumes:
      - ./src/main/resources/dmn:/deployment-files/dmn
    ports:
      - "8097:8097"

  wa-postgres:
    image: "postgres:15.18"
    container_name: wa-postgres
    ports:
      - 7432:5432
    networks:
      - wa-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wa-password
      POSTGRES_DB: wa_workflow_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 15

  wa-workflow-api:
    platform: linux/amd64
    image: hmctsprod.azurecr.io/wa/workflow-api:latest
    container_name: wa-workflow-api
    ports:
      - "8099:8099"
    networks:
      - wa-network
    depends_on:
      wa-postgres:
        condition: service_healthy
    environment:
      CAMUNDA_URL: "http://host.docker.internal:8097/engine-rest"
      S2S_URL: "http://host.docker.internal:8489"
      WA_S2S_AUTHORIZED_SERVICES: "wa_workflow_api,wa_case_event_handler,camunda-bpm,xui_webapp,wa_task_management_api,pcs_api"
      POSTGRES_HOST: "wa-postgres"
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: wa-password

  wa-task-monitor:
    platform: linux/amd64
    image: hmctsprod.azurecr.io/wa/task-monitor:latest
    container_name: wa-task-monitor
    networks:
      - wa-network
    ports:
      - "8077:8077"
    environment:
      OPEN_ID_IDAM_URL: "http://host.docker.internal:5062"
      IDAM_URL: "http://host.docker.internal:5062"
      CAMUNDA_URL: "http://host.docker.internal:8097/engine-rest"
      CCD_URL: "http://host.docker.internal:4452"
      S2S_URL: "http://host.docker.internal:8489"
      WA_TASK_MANAGEMENT_API_URL: "http://host.docker.internal:8087"
      WA_SYSTEM_USERNAME: "wa-system-user@localhost@hmcts.net"
      WA_S2S_AUTHORIZED_SERVICES: "wa_task_monitor,wa_task_management_api,pcs_api"
      POSTGRES_HOST: "host.docker.internal"
      POSTGRES_PORT: 6432
      POSTGRES_USERNAME: "postgres"

networks:
  wa-network:
