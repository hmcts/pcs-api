# Local build cache. Jenkins runs every Gradle invocation with --no-daemon
# (hardcoded in cnp-jenkins-library's GradleBuilder.gradle()), so the cache
# directory under GRADLE_USER_HOME is the only reuse available between the ~14
# invocations in a build. Measured locally: a clean + `test` drops from 46s to 6s
# when compileJava/compileTestJava/test come back FROM-CACHE.
org.gradle.caching=true

# Heap for the Gradle process itself. Gradle's default is 512m, which is tight for
# this build's plugin set (Spring Boot, cftlib, CCD SDK, Lombok, Serenity, Pact).
# Metaspace is raised because that plugin set loads a lot of classes.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Deliberately NOT set:
#
# org.gradle.parallel — this is a single-project build ("No sub-projects" per
#   `gradlew projects`). Parallel *project* execution has nothing to parallelise
#   here. Intra-task parallelism comes from maxParallelForks on `test` instead.
#
# org.gradle.configuration-cache — verified broken on this build (Gradle 9.6.1).
#   Two hard incompatibilities:
#     1. build.gradle:303 getCheckedOutGitCommitHash() runs `git rev-parse` as an
#        external process at configuration time (feeds the Pact pacticipantVersion).
#     2. The `test` task's doFirst closure resolves `configurations.mockitoAgent`
#        at execution time, which references a script object.
#   Re-evaluate if those two are refactored (a ValueSource for the git hash and a
#   captured file collection for the agent jar would fix them).
